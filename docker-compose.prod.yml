# Production stack: Postgres+pgvector + the web app, one command.
# Your local dev stack (docker-compose.yml) is left untouched — this is separate.
#
#   Provide secrets via the shell or a .env file (NOT committed), then:
#     docker compose -f docker-compose.prod.yml -p brd_prod up -d --build
#
# The DB port is intentionally NOT published — only `web` reaches it over the
# compose network. Put a TLS-terminating reverse proxy (nginx/Caddy/Traefik) in
# front of `web` for anything public.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-brd}
    volumes:
      - brd_pgdata_prod:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro   # schema applied on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brd} -d ${POSTGRES_DB:-brd}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible OBJECT STORAGE for uploaded BRD source files (backend/core/storage.py).
  # Mirrors the dev stack's `storage` service (docker-compose.yml) so a container rebuild
  # never loses uploaded files — swap for AWS S3 / R2 / hosted MinIO by changing S3_* only.
  storage:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - brd_objects_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      BRD_HOST: 0.0.0.0
      BRD_PORT: 8000
      # Reaches the db/storage services over the compose network (not localhost:5433/9000).
      DATABASE_URL: postgresql://${POSTGRES_USER:-brd}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brd}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:?set VOYAGE_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      EMBED_MODEL_DOCS: ${EMBED_MODEL_DOCS:-voyage-4}
      EMBED_MODEL_QUERY: ${EMBED_MODEL_QUERY:-voyage-4-lite}
      RERANK_MODEL: ${RERANK_MODEL:-rerank-2.5}
      GEN_MODEL: ${GEN_MODEL:?set GEN_MODEL}
      REFINE_VERIFY: ${REFINE_VERIFY:-1}
      VOYAGE_EMBED_BATCH: ${VOYAGE_EMBED_BATCH:-10}
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: ${STORAGE_BUCKET:-brd-sources}
      S3_ENDPOINT_URL: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    ports:
      - "${BRD_PUBLIC_PORT:-8000}:8000"

volumes:
  brd_pgdata_prod:
  brd_objects_prod:
